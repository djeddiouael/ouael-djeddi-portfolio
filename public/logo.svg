<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <!-- Primary Brand Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="aGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Shield Background Gradient -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Subtle Core Glow -->
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Emblem Group (Centered at x=45, y=45) -->
  <g transform="translate(5, 5)">
    <!-- Hexagonal Shield -->
    <path
      d="M40 5 L72 23 L72 57 L40 75 L8 57 L8 23 Z"
      fill="url(#bGrad)"
      stroke="url(#pGrad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Ambient Glow -->
    <circle cx="40" cy="40" r="22" fill="url(#cGlow)" />

    <!-- Neural Network Traces -->
    <g opacity="0.4" stroke="url(#aGrad)" stroke-width="1" stroke-dasharray="2 2">
      <line x1="40" y1="18" x2="40" y2="62" />
      <line x1="20" y1="40" x2="60" y2="40" />
      <line x1="26" y1="26" x2="54" y2="54" />
      <line x1="26" y1="54" x2="54" y2="26" />
    </g>

    <!-- Monogram: O & D Intertwined -->
    <path
      d="M40 18 C26 18 19 28 19 40 C19 52 26 62 40 62"
      fill="none"
      stroke="url(#pGrad)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <path
      d="M40 18 C54 18 61 28 61 40 C61 52 54 62 40 62"
      fill="none"
      stroke="url(#aGrad)"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Central AI Core Node -->
    <polygon points="40,34 46,40 40,46 34,40" fill="url(#pGrad)" />
    <circle cx="40" cy="40" r="1.5" fill="#FFFFFF" />

    <!-- Neural Vertices -->
    <circle cx="40" cy="18" r="2.5" fill="#C084FC" />
    <circle cx="40" cy="62" r="2.5" fill="#22D3EE" />
    <circle cx="19" cy="40" r="2.5" fill="#818CF8" />
    <circle cx="61" cy="40" r="2.5" fill="#06B6D4" />
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(100, 25)">
    <!-- Primary Name -->
    <text
      x="0"
      y="24"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="26"
      font-weight="900"
      letter-spacing="2"
      fill="url(#pGrad)"
    >
      OUAEL DJEDDI
    </text>

    <!-- Subtitle / Discipline Tag -->
    <text
      x="1"
      y="44"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="3.5"
      fill="#22D3EE"
      opacity="0.9"
    >
      AI &amp; FULL STACK DEVELOPER
    </text>

    <!-- Subtle Decorative Tech Line -->
    <line x1="0" y1="52" x2="270" y2="52" stroke="url(#aGrad)" stroke-width="1" opacity="0.3" />
  </g>
</svg>
