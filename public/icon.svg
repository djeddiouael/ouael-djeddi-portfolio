<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Primary Futuristic Brand Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Shield Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Tech Hexagon Shield -->
  <path
    d="M50 6 L88 27 L88 73 L50 94 L12 73 L12 27 Z"
    fill="url(#bgGrad)"
    stroke="url(#primaryGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Ambient Core Glow -->
  <circle cx="50" cy="50" r="28" fill="url(#coreGlow)" />

  <!-- Neural Network & Circuit Grid Traces -->
  <g opacity="0.4" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="2 3">
    <line x1="50" y1="20" x2="50" y2="50" />
    <line x1="50" y1="50" x2="50" y2="80" />
    <line x1="28" y1="50" x2="50" y2="50" />
    <line x1="50" y1="50" x2="72" y2="50" />
    <line x1="32" y1="35" x2="68" y2="65" />
    <line x1="32" y1="65" x2="68" y2="35" />
  </g>

  <!-- Geometric Monogram: Intersecting "O" & "D" (Ouael Djeddi) + AI Nexus -->
  <!-- Left Loop: "O" Arch -->
  <path
    d="M50 22 C34 22 24 34 24 50 C24 66 34 78 50 78"
    fill="none"
    stroke="url(#primaryGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Right Loop: "D" Arch -->
  <path
    d="M50 22 C66 22 76 34 76 50 C76 66 66 78 50 78"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Inner AI Core Diamond & Crossbar -->
  <polygon
    points="50,42 58,50 50,58 42,50"
    fill="url(#primaryGrad)"
    filter="url(#aiGlow)"
  />

  <!-- Neural Network Connection Nodes -->
  <circle cx="50" cy="22" r="3" fill="#C084FC" />
  <circle cx="50" cy="78" r="3" fill="#22D3EE" />
  <circle cx="24" cy="50" r="3" fill="#818CF8" />
  <circle cx="76" cy="50" r="3" fill="#06B6D4" />

  <!-- Central Micro Core Node -->
  <circle cx="50" cy="50" r="2" fill="#FFFFFF" />
</svg>
